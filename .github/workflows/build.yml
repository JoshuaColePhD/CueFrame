name: Mac build and tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and run logic and media tests
        run: >-
          xcodebuild -project EasyDemo.xcodeproj -scheme EasyDemo
          -configuration Debug -derivedDataPath build/DerivedData
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          -only-testing:EasyDemoTests test
      - name: Package local Release build
        run: ./scripts/build-local.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EasyDemo-Mac
          path: build/EasyDemo-Mac.zip
